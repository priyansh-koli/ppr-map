# Local development stack. Run through the Makefile (`make up`), which passes --env-file ../.env.
# Everything is served from one origin through Caddy: http://localhost:8080
name: ppr-map

services:
  db:
    image: postgis/postgis:16-3.5
    # The official image is amd64-only; Apple Silicon runs it under Rosetta (D-029).
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pprmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pprmap}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h: during first-run init Postgres answers on the unix socket before it listens on TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-pprmap} -d ${POSTGRES_DB:-pprmap}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    # .env holds host-side addresses (localhost); inside the network each service has its own name.
    environment: &container-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pprmap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pprmap}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      NOMINATIM_URL: http://nominatim:8080
    restart: unless-stopped
    # Behind Caddy: trust X-Forwarded-For so the API sees the client IP (rate limits, IP hashing).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--reload", "--reload-dir", "/srv/backend/app"]
    volumes:
      - ../backend/app:/srv/backend/app:ro
      - ../backend/alembic:/srv/backend/alembic:ro
      # rates.yaml and sources.yaml, so an edit there needs no rebuild (PPR_CONFIG_DIR).
      - ../config:/srv/config:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    environment: *container-env
    restart: unless-stopped
    # tini as PID 1, so `docker compose stop` does not wait out the 10 s kill timeout.
    init: true
    volumes:
      - pipeline-data:/srv/data
    # RQ workers and the APScheduler process are added in Phase 2 (D-007).
    command: ["python", "-c", "print('worker: nothing to run until Phase 2'); import time; time.sleep(10**9)"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config/martin.yaml"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pprmap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pprmap}
    volumes:
      - ./martin:/config:ro
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }

  frontend:
    # Next.js fixes rewrites and NEXT_PUBLIC_* values at build time, so they are build args.
    build:
      context: ../frontend
      args:
        INTERNAL_API_ORIGIN: http://api:8000
        NEXT_PUBLIC_BASEMAP_PMTILES_URL: ${NEXT_PUBLIC_BASEMAP_PMTILES_URL:-}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/basemap:/srv/basemap:ro
    restart: unless-stopped
    depends_on: [frontend, api, martin]

  mailpit:
    # Catches all outgoing email in development: http://localhost:8025
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  nominatim:
    # Batch geocoder (D-003). Opt-in: `make geocoder` (needs Docker memory >= 12 GB).
    # First start imports the Ireland extract from data/osm/ (`make osm-extract` downloads it);
    # the import takes an hour or more. Containers here cannot reach Geofabrik over TLS, so the
    # file is fetched on the host (D-032). No REPLICATION_URL for the same reason: refresh by
    # re-importing a newer extract monthly.
    profiles: ["geocoder"]
    image: mediagis/nominatim:4.5
    environment:
      PBF_PATH: /osm/ireland-and-northern-ireland-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      THREADS: "6"
    shm_size: 1gb
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - ../data/osm:/osm:ro
    ports:
      - "127.0.0.1:8088:8080"

volumes:
  db-data:
  pipeline-data:
  nominatim-data:
