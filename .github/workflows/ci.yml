name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend + pipeline
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pprmap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d pprmap_test"
          --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/pprmap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            pipeline/pyproject.toml
      - run: pip install -e "backend[dev]" -e "pipeline[dev]"
      - name: Lint
        run: |
          (cd backend && ruff check . && ruff format --check .)
          (cd pipeline && ruff check . && ruff format --check .)
      - name: Type-check
        run: |
          (cd backend && mypy app)
          (cd pipeline && mypy src)
      - name: Test (including live PostGIS migration checks)
        run: |
          (cd backend && pytest -q)
          (cd pipeline && pytest -q)

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright smoke tests
    if: github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
