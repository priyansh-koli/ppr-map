[project]
name = "ppr-pipeline"
version = "0.1.0"
description = "Data pipeline: PPR ingest, normalisation, dedupe, geocoding, enrichment, aggregates"
requires-python = ">=3.12,<3.13"
# Depends on the backend package for the shared SQLAlchemy models (install backend first).
dependencies = [
  "ppr-map-backend",
  "typer>=0.12",
  "pyyaml>=6",
  "httpx>=0.27",
  "pyogrio>=0.10",  # bundles GDAL: reads Tailte FileGDB/GeoJSON boundaries
  "h3>=4",  # H3 cells computed in Python, not in Postgres (D-024)
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
ppr = "ppr_pipeline.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running PostGIS database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# The backend is an editable install, which mypy cannot follow; point it at the source.
mypy_path = "../backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "pyogrio.*", "h3.*"]
ignore_missing_imports = true
